# Feature: fixed-bias object with a linear bias ramp (Langmuir probe sweep). The collected
# current vs bias gives the I-V characteristic: ion collection, exponential electron
# retardation region (slope 1/T_e) and OML-like electron collection above the plasma potential.
title = "Langmuir probe I-V sweep"
seed = 7

[grid]
cells = [32, 32, 32]
dx_debye = 0.3
centered = true

[time]
dt_wpe = 0.15
steps = 12000

[boundaries]
default = { field = "dirichlet", value = 0.0, particle = "open" }

[[species]]
name = "electron"
charge = -1
mass_me = 1
density = 1e13
temperature = 2.0
ppc = 8

[[species]]
name = "ion"
charge = 1
mass_me = 100
density = 1e13
temperature = 0.2
ppc = 8
subcycle = 2

[[objects]]
name = "probe"
shape = "sphere"
radius = 1.66e-3
bias = "fixed"
potential = -8.0
ramp = 1.1e6                    # V/s: -8 V -> +3 V over the run

[output]
history_every = 10
fields_every = 4000
status_every = 1000
