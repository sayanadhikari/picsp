# Electrostatic two-stream instability: two counter-streaming electron beams over an
# immobile ion background in a periodic box. The seeded mode grows exponentially;
# compare with examples/analysis/two_stream_growth.py (numerical dispersion relation).
title = "Two-stream instability"
seed = 5
reference_species = "beam+"   # dt_wpe is in units of the single-beam plasma frequency

[grid]
cells = [64, 4, 4]
length = [0.0186, 0.00116, 0.00116]

[time]
dt_wpe = 0.05
duration_wpe = 50

[boundaries]
default = { field = "periodic", particle = "periodic" }

[[species]]
name = "beam+"
charge = -1
mass_me = 1
density = 5e13
temperature = 0.1
drift = [1.0e6, 0.0, 0.0]
ppc = 64
load = "quiet"
perturbation = { axis = "x", amplitude = 1e-3, mode = 1 }

[[species]]
name = "beam-"
charge = -1
mass_me = 1
density = 5e13
temperature = 0.1
drift = [-1.0e6, 0.0, 0.0]
ppc = 64
load = "quiet"

[[species]]
name = "ion"
charge = 1
mass_amu = 1e6
density = 1e14
distribution = "cold"
ppc = 16
load = "quiet"


[output]
dir = "output_two_stream"
history_every = 2
fields_every = 100
particles_every = 100
particle_stride = 4
status_every = 200
