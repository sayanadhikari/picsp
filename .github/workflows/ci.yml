name: CI

on:
  push:
    branches: [main, picsp3d]
    paths-ignore: ["**.md", "docs/**", "legacy/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "legacy/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OMPI_MCA_rmaps_base_oversubscribe: "1"   # allow 4-rank tests on small runners
  OMPI_MCA_btl_vader_single_copy_mechanism: none  # avoid CMA warnings in containers

jobs:
  build-test:
    name: build + test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            cmake ninja-build ccache libopenmpi-dev openmpi-bin
          if [ "${{ matrix.compiler }}" = clang ]; then sudo apt-get install -y -q clang libomp-dev; fi

      - name: ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.compiler }}-

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then CXX=clang++; else CXX=g++; fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPICSP_NATIVE=OFF \
            -DPICSP_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test (serial and 4 MPI ranks)
        run: ctest --test-dir build --output-on-failure --timeout 900

      - name: Smoke test examples
        run: |
          cd examples
          OMP_NUM_THREADS=1 mpirun -np 2 ../build/picsp3d cubesat_wake.toml --check --output /tmp/check
          OMP_NUM_THREADS=2 mpirun -np 1 --bind-to none ../build/picsp3d langmuir.toml --steps 100 --output /tmp/langmuir
          OMP_NUM_THREADS=1 mpirun -np 4 ../build/picsp3d two_stream.toml --steps 50 --output /tmp/two_stream

      - name: Upload executable
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v7
        with:
          name: picsp3d-linux-x86_64
          path: build/picsp3d
          retention-days: 7

  distros:
    name: install (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
      options: --shm-size=1g   # Docker's 64 MB /dev/shm makes Open MPI (UCX) die with SIGBUS
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [ "ubuntu:22.04", "debian:12", "rockylinux:8", "rockylinux:9", "fedora:42",
                 "opensuse/leap:15.6", "archlinux:latest" ]
    steps:
      - name: Prerequisites for checkout
        run: |
          if command -v apt-get >/dev/null; then apt-get update -q && apt-get install -y -q git sudo
          elif command -v dnf >/dev/null; then dnf install -y -q git sudo which
          elif command -v zypper >/dev/null; then zypper -n install git sudo tar gzip which
          elif command -v pacman >/dev/null; then pacman -Sy --noconfirm git sudo which; fi
      - uses: actions/checkout@v7
      - name: Install dependencies, build and test
        run: ./scripts/install.sh --test
      - name: Run an example
        run: |
          export OMPI_ALLOW_RUN_AS_ROOT=1 OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          for d in /usr/lib64/openmpi/bin /usr/lib64/mpi/gcc/openmpi4/bin; do [ -d $d ] && export PATH=$d:$PATH; done
          cd examples && OMP_NUM_THREADS=2 mpirun -np 2 --oversubscribe ../build/picsp3d two_stream.toml --steps 20 --output /tmp/ts

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cmake ninja-build libopenmpi-dev openmpi-bin
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPICSP_NATIVE=OFF -DPICSP_SANITIZE=ON
          cmake --build build
      - name: Test (serial)
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1   # Open MPI keeps global allocations alive
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          OMP_NUM_THREADS: "2"
        run: ctest --test-dir build -R _serial -E test_magnetic --output-on-failure --timeout 1800   # magnetic orbit test is slow under ASan; pusher covered by test_particles

  python:
    name: post-processing package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install
        run: pip install -e python ruff
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 python examples
      - name: Byte-compile
        run: python -m compileall -q python examples
      - name: Import
        run: python -c "import picsp_post; print(picsp_post.__version__)"
      - name: Unit tests (mesh import tool)
        run: |
          pip install pytest
          python -m pytest -q tests/python
      - name: Mesh tool smoke test
        run: |
          python -m picsp_post mesh info examples/geometry/cubesat_3u.stl
          python -m picsp_post mesh import examples/geometry/cubesat_3u.stl --anchor bottom \
            --cells-across 20 -o /tmp/obj.toml --preview /tmp/preview.png

  examples:
    name: feature examples (run + analyse)
    needs: [build-test, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libopenmpi-dev openmpi-bin libgomp1
          pip install -e "python[examples]"
      - uses: actions/download-artifact@v8
        with:
          name: picsp3d-linux-x86_64
          path: build
      - name: Run fast examples
        env:
          PICSP3D: ${{ github.workspace }}/build/picsp3d
        run: |
          chmod +x build/picsp3d
          cd examples/features
          for e in 03_gyration_ExB_drift 06_velocity_distributions 13_MCC_ion_mobility 14_ionization_avalanche; do
            echo "::group::$e"
            python run_example.py "$e"
            echo "::endgroup::"
          done
      - name: CAD import and geometry check
        run: |
          cd examples/features/16_mesh_import
          python cad/make_cad_export.py
          python -m picsp_post mesh import cad/cubesat_mm.stl --units mm --anchor center --rotate 0 0 -30 \
            --cells-across 24 --margin 0.6 -o /tmp/object.toml
          OMP_NUM_THREADS=2 mpirun -np 1 --bind-to none ../../../build/picsp3d input.toml --check --output /tmp/geometry_check
          test -f /tmp/geometry_check/surface.pvd
      - name: CLI post-processing
        run: python -m picsp_post info examples/features/13_MCC_ion_mobility/output
      - name: Upload figures
        uses: actions/upload-artifact@v7
        with:
          name: example-figures
          path: docs/media/
          retention-days: 7
